name: Fullstack CI (Node.js Backend/Frontend + Python Tests)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-nodejs:
    name: Backend Node.js Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies, lint and test
        run: |
          if [ -f "backend/package.json" ]; then
            cd backend
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run lint --if-present
            npm test --if-present
          else
            echo "backend/package.json not found yet, skipping Node.js backend checks"
          fi

  backend-python-tests:
    name: Backend Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run Pytest
        run: |
          if [ -d "backend" ]; then
            cd backend
            python -m pip install --upgrade pip
            pip install pytest
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            pytest || [ $? -eq 5 ]
          else
            echo "Directory backend/ not found yet, skipping Python tests"
          fi

  frontend-nodejs:
    name: Frontend Node.js Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies, lint and test
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run lint --if-present
            npm test --if-present
          else
            echo "frontend/package.json not found yet, skipping Node.js frontend checks"
          fi
